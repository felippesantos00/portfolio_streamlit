[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
address = "0.0.0.0"

[theme]
base = "dark"
primaryColor = "#d20c0cff"
backgroundColor = "#000000ff"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#ffffffff"
font = "sans serif"

[logger]
level = "info"
messageFormat = "%(asctime)s %(message)s"

[client]
showErrorDetails = true
toolbarMode = "auto"